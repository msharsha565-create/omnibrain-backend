spring.application.name=omnibrain-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Required: no default, so the app refuses to start without a strong signing secret.
omnibrain.jwt.secret=${JWT_SECRET}
omnibrain.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
# Comma-separated usernames allowed to call /admin/**
omnibrain.admin-users=${ADMIN_USERS:}

# Authentication is JWT-only; do not generate a default in-memory user/password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- RAG ---
# hashing (default): offline, lexical. openai: any OpenAI-compatible /embeddings endpoint (semantic).
omnibrain.embeddings.provider=${EMBEDDINGS_PROVIDER:hashing}
omnibrain.embeddings.base-url=${EMBEDDINGS_BASE_URL:https://api.openai.com/v1}
omnibrain.embeddings.model=${EMBEDDINGS_MODEL:text-embedding-3-small}
omnibrain.embeddings.api-key=${EMBEDDINGS_API_KEY:${OPENAI_API_KEY:}}
# extractive (default): quotes sentences from the documents. llm: asks a chat model, grounded in them.
omnibrain.rag.answerer=${RAG_ANSWERER:extractive}
omnibrain.rag.top-k=${RAG_TOP_K:3}
omnibrain.rag.min-score=${RAG_MIN_SCORE:0.05}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

