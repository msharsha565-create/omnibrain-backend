spring.application.name=omnibrain-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Required: no default, so the app refuses to start without a strong signing secret.
omnibrain.jwt.secret=${JWT_SECRET}
omnibrain.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
# Comma-separated usernames allowed to call /admin/**
omnibrain.admin-users=${ADMIN_USERS:}

# Authentication is JWT-only; do not generate a default in-memory user/password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
